name: .NET desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Lan.Shapes.sln

      - name: Build
        run: dotnet build Lan.Shapes.sln --configuration ${{ matrix.configuration }} --no-restore --nologo

      - name: Test
        run: dotnet test Lan.Shapes.sln --configuration ${{ matrix.configuration }} --no-build --no-restore --nologo
